[modes.free]
writable = ["*"]
strategy = ""

[modes.implement]
writable = ["src/", "lib/"]
strategy = ""

[modes.test]
writable = ["tests/", "test/", "spec/"]
strategy = "Write tests for expected behavior, not current behavior."

[modes.docs]
writable = ["docs/", "README.md", "CHANGELOG.md"]
strategy = "Explain the why, not the what."

[modes.explore]
writable = []
strategy = "Map the territory before making changes."

[modes.review]
writable = []
strategy = "Read everything, then verify with tests."

[controller]
default_mode = "free"
max_consecutive_failures = 3
max_turns_in_explore = 20

[experiment]
# A/B test: does an advisory nudge change the agent's next choice? Each eligible
# bypass forms a trial — with probability `nudge_probability` it's NUDGED, else
# it's a silent CONTROL. After-the-fact heed (did the agent use the suggested
# tool within `heed_window` calls) is logged to ~/.kibitzer/nudge_trials.jsonl;
# scripts/nudge_lift.py computes lift = heed(nudge) - heed(control). Set
# nudge_probability = 1.0 to always nudge (no experiment).
nudge_probability = 0.5
heed_window = 10

[coach]
frequency = 5
enabled = true

[coach.model_overrides]
haiku = { frequency = 3 }
sonnet = { frequency = 5 }
opus = { frequency = 10 }

[docs]
context7 = true
# root = "docs/"
# [docs.refs]
# Edit = "tools/edit.md"
# Read = "tools/read.md"
# Bash = "tools/bash.md"

[plugins.blq]
mode = "suggest"
enabled = true

[plugins.jetsam]
mode = "observe"
enabled = true

[plugins.squackit]
mode = "suggest"
enabled = true
