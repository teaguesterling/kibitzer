[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "kibitzer"
version = "0.9.1"
description = "Claude Code extension that watches agent tool calls and suggests structured alternatives"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [
    { name = "Teague Sterling" },
]
keywords = ["claude-code", "hooks", "mcp", "agent", "toolcraft", "developer-tools"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Quality Assurance",
    "Topic :: Software Development :: Testing",
]
dependencies = [
    "click>=8.1",
    # Upper bound: mcp 2.x RENAMED FastMCP to MCPServer and removed
    # mcp.server.fastmcp, which kibitzer.mcp.server imports. MEASURED in one venv,
    # one variable: mcp 1.30.0 boots `kibitzer mcp serve` exit 0, mcp 2.3.0 exits 1
    # with `ModuleNotFoundError: No module named 'mcp.server.fastmcp'`. This cap is a
    # STOPGAP, not the fix -- the migration to MCPServer is the fix.
    "mcp[cli]>=1.0,<2",
    # The shared failure-mode taxonomy (kibitzer.failure_modes imports it) — the
    # dependency-free lackpy language leaf, not the full lackpy runtime.
    "lackpy-lang>=0.12",
]

[project.urls]
Homepage = "https://github.com/teague/kibitzer"
Repository = "https://github.com/teague/kibitzer"
Issues = "https://github.com/teague/kibitzer/issues"
Documentation = "https://kibitzer.readthedocs.io"

[project.scripts]
kibitzer = "kibitzer.cli:cli"

[tool.hatch.build.targets.wheel]
packages = ["src/kibitzer"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-asyncio>=0.21",
    "pytest-cov>=4.0",
    "ruff>=0.1",
    "duckdb>=1.5",
]
docs = [
    "mkdocs>=1.5",
    "mkdocs-material>=9.0",
]
fledgling = [
    # The `fledgling` import module (fledgling.connect()) is shipped by the
    # `fledgling-mcp` distribution; the bare `fledgling` name on PyPI is an
    # unrelated 0.0.1 stub. >=0.12 has the connect() API the coach uses.
    "fledgling-mcp>=0.12",
]
pluckit = [
    # The `pluckit` import module (with Plucker) is shipped by `ast-pluckit`;
    # the bare `pluckit` name on PyPI is an unrelated package.
    "ast-pluckit>=0.13",
]
# (no [umwelt] extra: kibitzer reads compiled umwelt *policy DBs* via its own
# kibitzer.umwelt subpackage; it never imports the external `umwelt` package.
# The bare `umwelt` name on PyPI is an unrelated 2019 package that conflicts
# with mcp[cli], so pinning it was both wrong and harmful.)

[tool.ruff.lint]
# DECLARED, because ruff's default select is not a constant. This project was
# green on ruff's old default of E4/E7/E9/F. Later ruff releases widened the
# default set to include BLE, S, SIM, UP, RUF, PIE, PL, I and more, so ruff
# 0.17.3 reported 133 errors against code that had not changed since the last
# green run (2026-07-19). MEASURED on that unchanged tree: the default set gives
# 133 errors, `--select E4,E7,E9,F` gives "All checks passed!".
#
# This restores the rule set the project actually enforced; it suppresses
# nothing that was ever enforced here. Widening it is a deliberate choice to
# make later, one rule family at a time -- 34 blind-except and 10
# try-except-pass findings are real judgments about error handling, not
# formatting, and they deserve their own review rather than a bulk --fix.
select = ["E4", "E7", "E9", "F"]

[tool.ruff.lint.per-file-ignores]
# tests legitimately carry availability-probe imports (F401) and setup-only
# locals (F841); don't fail lint on them.
"tests/**" = ["F401", "F841", "E402"]  # E402: importorskip-before-import is intentional
